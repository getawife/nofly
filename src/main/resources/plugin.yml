name: NoFly
version: "${version}"
main: dev.nofly.no_fly
api-version: "1.21"
depend: [packetevents]
author: nofly
description: A fly detection plugin for Paper 1.21.x.
commands:
  nofly:
    description: Manage the fly check
    permission: nofly.admin
    usage: /nofly <reload|info|reset>
permissions:
  nofly.bypass:
    description: Skip all fly checks
    default: op
  nofly.admin:
    description: Use /nofly
    default: op
    children:
      nofly.alerts: true
  nofly.alerts:
    description: Receive fly flag alerts in chat
    default: op
